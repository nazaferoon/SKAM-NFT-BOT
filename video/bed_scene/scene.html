<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="720" height="1280"></canvas>
<script>
const W=720,H=1280,FPS=30;
const c=document.getElementById('c'),x=c.getContext('2d');
const F='"Inter", sans-serif';
function rng(s){return()=>{s=(s*16807)%2147483647;return (s-1)/2147483646}}
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const easeOut=t=>1-Math.pow(1-t,3);
function rr(x0,y0,w,h,r){x.beginPath();x.roundRect(x0,y0,w,h,r);}
function lg(x0,y0,x1,y1,stops){const g=x.createLinearGradient(x0,y0,x1,y1);stops.forEach(([o,c])=>g.addColorStop(o,c));return g}
function rg(x0,y0,r0,x1,y1,r1,stops){const g=x.createRadialGradient(x0,y0,r0,x1,y1,r1);stops.forEach(([o,c])=>g.addColorStop(o,c));return g}
function ell(cx,cy,rx,ry,fill){x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);x.fillStyle=fill;x.fill()}
function poly(pts,fill){x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();if(fill){x.fillStyle=fill;x.fill()}}
function line(pts,stroke,w){x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.strokeStyle=stroke;x.lineWidth=w;x.stroke()}

/* ---------------- WALL ---------------- */
function wall(){
  x.fillStyle=lg(0,0,0,935,[[0,'#16173f'],[0.6,'#24265c'],[1,'#2b2c66']]);
  x.fillRect(0,0,W,935);
  // wallpaper stripes
  for(let i=0;i<W;i+=36){x.fillStyle='rgba(255,255,255,0.025)';x.fillRect(i,0,14,780);
    x.fillStyle='rgba(0,0,0,0.05)';x.fillRect(i+14,0,2,780);}
  // small diamond motif
  x.fillStyle='rgba(170,180,255,0.07)';
  for(let yy=40;yy<780;yy+=48)for(let xx=25+((yy/48)%2)*18;xx<W;xx+=36){poly([[xx,yy-5],[xx+4,yy],[xx,yy+5],[xx-4,yy]],'rgba(170,180,255,0.07)')}
  // crown molding
  x.fillStyle=lg(0,0,0,22,[[0,'#3a3b78'],[1,'#1c1d48']]);x.fillRect(0,0,W,18);
  x.fillStyle='rgba(255,255,255,0.08)';x.fillRect(0,18,W,3);
  // wainscoting
  x.fillStyle=lg(0,780,0,935,[[0,'#2c2d68'],[1,'#22234f']]);x.fillRect(0,780,W,155);
  for(let px=8;px<W;px+=118){rr(px,800,100,108,4);x.strokeStyle='rgba(0,0,0,0.25)';x.lineWidth=3;x.stroke();
    rr(px+2,802,100,108,4);x.strokeStyle='rgba(255,255,255,0.06)';x.lineWidth=2;x.stroke();}
  // chair rail
  x.fillStyle=lg(0,772,0,790,[[0,'#4a4c90'],[0.5,'#3a3c7c'],[1,'#1e1f4a']]);x.fillRect(0,772,W,16);
  // baseboard
  x.fillStyle=lg(0,912,0,940,[[0,'#45478a'],[1,'#1d1e48']]);x.fillRect(0,912,W,26);
  x.fillStyle='rgba(255,255,255,0.1)';x.fillRect(0,912,W,2);
  // outlet
  rr(682,880,22,28,3);x.fillStyle='#c9cbe0';x.fill();x.fillStyle='#55577a';
  ell(689,890,2,3,'#55577a');ell(697,890,2,3,'#55577a');ell(693,899,2,2,'#55577a');
}

/* ---------------- FLOOR ---------------- */
function floor(){
  x.fillStyle=lg(0,935,0,H,[[0,'#3a2a2a'],[0.4,'#5a3d2c'],[1,'#6e4a32']]);
  x.fillRect(0,935,W,H-935);
  x.save();x.beginPath();x.rect(0,936,W,H-936);x.clip();
  const vp=[360,560];
  const rows=[936,950,968,990,1018,1052,1094,1146,1208,1280];
  const r=rng(7);
  for(let k=-30;k<=30;k++){
    const bx=360+k*62;
    line([[vp[0]+(bx-vp[0])*((936-vp[1])/(H-vp[1])),936],[bx,H]],'rgba(20,10,10,0.55)',1.4);
    // plank tint
    const t=r();x.fillStyle=`rgba(${t>0.5?255:0},${t>0.5?220:0},${t>0.5?180:0},${0.03+r()*0.04})`;
    const bx2=bx+62;
    poly([[vp[0]+(bx-vp[0])*((936-vp[1])/(H-vp[1])),936],[vp[0]+(bx2-vp[0])*((936-vp[1])/(H-vp[1])),936],[bx2,H],[bx,H]],x.fillStyle);
    for(let i=0;i<rows.length-1;i++){ if(r()<0.45){
        const y=rows[i]+(rows[i+1]-rows[i])*r();
        const f=(y-vp[1])/(H-vp[1]);
        const xa=vp[0]+(bx-vp[0])*f, xb=vp[0]+(bx2-vp[0])*f;
        line([[xa,y],[xb,y]],'rgba(20,10,10,0.5)',1.2);
      }
      // grain
      const y=rows[i]+(rows[i+1]-rows[i])*r();const f=(y-vp[1])/(H-vp[1]);
      const xa=vp[0]+(bx-vp[0])*f+4, xb=vp[0]+(bx2-vp[0])*f-4;
      x.beginPath();x.moveTo(xa,y);x.quadraticCurveTo((xa+xb)/2,y+2*f,xb,y+1);x.strokeStyle='rgba(255,230,200,0.05)';x.lineWidth=1;x.stroke();
    }
  }
  x.restore();
  // wall/floor contact shadow
  x.fillStyle=lg(0,936,0,960,[[0,'rgba(0,0,0,0.45)'],[1,'rgba(0,0,0,0)']]);x.fillRect(0,936,W,24);
}

/* ---------------- WINDOW ---------------- */
function windowScene(t){
  const r=rng(11);
  // trim shadow
  rr(36,252,162,400,4);x.fillStyle='rgba(0,0,0,0.35)';x.fill();
  // frame
  rr(32,246,160,398,6);x.fillStyle=lg(32,0,192,0,[[0,'#d8d4cc'],[1,'#a9a49c']]);x.fill();
  // glass sky
  x.save();rr(46,260,132,370,2);x.clip();
  x.fillStyle=lg(0,260,0,630,[[0,'#070a28'],[0.6,'#1b2560'],[0.72,'#36407e']]);x.fillRect(46,260,132,370);
  // moon glow
  x.fillStyle=rg(140,318,10,140,318,90,[[0,'rgba(220,230,255,0.45)'],[1,'rgba(220,230,255,0)']]);x.fillRect(46,260,132,370);
  // stars
  for(let i=0;i<26;i++){const sx=48+r()*128,sy=262+r()*230,ph=r()*6.28,sz=0.6+r()*1.5;
    const a=0.4+0.6*Math.abs(Math.sin(t*2+ph));ell(sx,sy,sz,sz,`rgba(255,255,255,${a})`)}
  // moon
  ell(140,318,22,22,rg(134,312,2,140,318,22,[[0,'#fffbe8'],[1,'#e8e2c6']]));
  ell(132,312,4,4,'rgba(170,165,140,0.4)');ell(148,326,6,5,'rgba(170,165,140,0.35)');ell(146,308,3,3,'rgba(170,165,140,0.35)');ell(130,328,2.5,2.5,'rgba(170,165,140,0.35)');
  // far mountains (Madeira)
  x.beginPath();x.moveTo(46,530);x.bezierCurveTo(70,470,95,455,118,488);x.bezierCurveTo(135,505,150,500,178,520);x.lineTo(178,560);x.lineTo(46,560);x.closePath();x.fillStyle='#141a45';x.fill();
  x.beginPath();x.moveTo(46,548);x.bezierCurveTo(70,520,100,525,125,540);x.bezierCurveTo(150,552,165,545,178,548);x.lineTo(178,566);x.lineTo(46,566);x.closePath();x.fillStyle='#0d1236';x.fill();
  // house lights
  const lights=[[58,540],[66,534],[74,538],[88,530],[96,536],[104,528],[112,540],[60,552],[84,548],[120,546],[138,552],[150,548],[160,553],[70,522],[92,518]];
  lights.forEach(([lx,ly],i)=>{const a=0.7+0.3*Math.sin(t*3+i);ell(lx,ly,1.6,1.6,`rgba(255,210,120,${a})`);ell(lx,ly,4,4,`rgba(255,200,100,${0.15*a})`)});
  // sea
  x.fillStyle=lg(0,560,0,630,[[0,'#1e2a66'],[1,'#0b1238']]);x.fillRect(46,560,132,70);
  for(let i=0;i<14;i++){const yy=564+i*5,w=8+i*2.2,off=Math.sin(t*3+i*1.3)*4;
    x.fillStyle=`rgba(230,235,255,${0.55-i*0.03})`;x.fillRect(140-w/2+off,yy,w,1.4)}
  x.restore();
  // muntins
  x.fillStyle='#c9c4bb';x.fillRect(109,260,8,370);x.fillRect(46,436,132,8);
  x.fillStyle='rgba(0,0,0,0.2)';x.fillRect(116,260,2,370);x.fillRect(46,443,132,2);
  // inner frame shading
  rr(46,260,132,370,2);x.strokeStyle='rgba(0,0,0,0.3)';x.lineWidth=3;x.stroke();
  // glass reflection
  x.save();rr(46,260,132,370,2);x.clip();
  poly([[60,260],[80,260],[46,330],[46,300]],'rgba(255,255,255,0.06)');
  poly([[150,444],[170,444],[120,630],[100,630]],'rgba(255,255,255,0.04)');x.restore();
  // sill
  rr(22,636,180,16,3);x.fillStyle=lg(0,636,0,652,[[0,'#e6e2da'],[1,'#9d988f']]);x.fill();
  x.fillStyle='rgba(0,0,0,0.35)';x.fillRect(30,652,164,6);
  // plant on sill
  poly([[140,636],[170,636],[166,612],[144,612]],'#a2553a');x.fillStyle='#8a4630';x.fillRect(142,612,26,5);
  const lv=[[-14,-26],[-6,-34],[4,-36],[12,-28],[18,-18],[-18,-14]];
  lv.forEach(([dx,dy],i)=>{x.save();x.translate(155,612);x.rotate(Math.atan2(dy,dx)+Math.PI/2+Math.sin(t*1.5+i)*0.03);
    x.beginPath();x.ellipse(0,-Math.hypot(dx,dy)/2,6,Math.hypot(dx,dy)/2,0,0,Math.PI*2);x.fillStyle=i%2?'#2f6b45':'#3b8455';x.fill();
    x.beginPath();x.moveTo(0,0);x.lineTo(0,-Math.hypot(dx,dy)+4);x.strokeStyle='rgba(0,0,0,0.25)';x.lineWidth=1;x.stroke();x.restore();});
  // small toy car on sill
  rr(60,624,40,10,4);x.fillStyle='#c0392b';x.fill();rr(68,617,22,9,3);x.fillStyle='#e04a3a';x.fill();
  x.fillStyle='rgba(170,210,255,0.8)';x.fillRect(72,619,6,5);x.fillRect(80,619,6,5);
  ell(70,635,4.5,4.5,'#1a1a1a');ell(92,635,4.5,4.5,'#1a1a1a');ell(70,635,2,2,'#999');ell(92,635,2,2,'#999');
}
function curtains(t){
  // rod
  x.fillStyle=lg(0,228,0,238,[[0,'#d6b46a'],[1,'#7c5a22']]);rr(4,228,224,8,4);x.fill();
  ell(6,232,8,8,'#c9a55a');ell(226,232,8,8,'#c9a55a');
  // rings
  for(let i=0;i<9;i++){const rx=14+i*(i<4?10:0)+(i>=4?170+(i-4)*10:0);x.beginPath();x.arc(rx,238,4,0,6.28);x.strokeStyle='#b8954b';x.lineWidth=2;x.stroke();}
  const sway=Math.sin(t*1.2)*2;
  function panel(left){
    const x0=left?6:178, x1=left?58:228;
    const tieY=540, tieL=left?10:186, tieR=left?46:222;
    x.save();
    x.beginPath();
    x.moveTo(x0,236);x.lineTo(x1,236);
    x.bezierCurveTo(x1+(left?-6:0),380,tieR+(left?6:0),480,tieR,tieY);
    x.bezierCurveTo(tieR+(left?8:6)+sway,620,x1+(left?14:8)+sway,700,x1+(left?14:8)+sway,770);
    x.lineTo(x0-(left?0:6)+sway,770);
    x.bezierCurveTo(x0+sway,700,tieL-(left?0:6),620,tieL,tieY);
    x.bezierCurveTo(tieL,480,x0,380,x0,236);x.closePath();
    x.fillStyle=lg(x0,0,x1,0,[[0,'#7a1f2b'],[0.25,'#b23a48'],[0.45,'#8a2534'],[0.7,'#c04a56'],[1,'#7a1f2b']]);x.fill();
    x.clip();
    // folds
    for(let i=0;i<6;i++){const fx=x0+(x1-x0)*(i+0.5)/6;line([[fx,236],[fx+(tieL+ (tieR-tieL)*(i+0.5)/6-fx),tieY],[fx+sway+(left?2:-2)*i,770]],'rgba(0,0,0,0.18)',2)}
    // pattern dots
    for(let yy=250;yy<770;yy+=22)for(let xx=x0-10;xx<x1+20;xx+=14){ell(xx+(yy%44?7:0),yy,1.3,1.3,'rgba(255,220,200,0.12)')}
    // moon rim light
    x.fillStyle=lg(left?x1-12:x0,0,left?x1:x0+12,0,left?[[0,'rgba(180,190,255,0)'],[1,'rgba(180,190,255,0.25)']]:[[0,'rgba(180,190,255,0.25)'],[1,'rgba(180,190,255,0)']]);x.fillRect(x0-10,236,x1-x0+30,540);
    x.restore();
    // tie-back
    rr(tieL-3,tieY-6,tieR-tieL+6,12,6);x.fillStyle='#e0b64a';x.fill();
    x.fillStyle='rgba(0,0,0,0.25)';x.fillRect(tieL-2,tieY+3,tieR-tieL+4,3);
    // tassel
    const tx=left?tieR+2:tieL-2;line([[tx,tieY],[tx,tieY+18]],'#c9a03c',2);
    poly([[tx-5,tieY+16],[tx+5,tieY+16],[tx+7,tieY+34],[tx-7,tieY+34]],'#d9b04a');
  }
  panel(true);panel(false);
}

/* ---------------- WALL DECOR ---------------- */
function bunting(t){
  const pts=[];for(let i=0;i<=40;i++){const u=i/40;pts.push([236+u*470,170+Math.sin(u*Math.PI)*38])}
  line(pts,'#e9e4d8',1.5);
  const cols=['#1f8a4c','#f2f2f2','#c8102e','#ffcf3f'];
  for(let i=0;i<11;i++){const u=(i+0.5)/11,px=236+u*470,py=170+Math.sin(u*Math.PI)*38,sw=Math.sin(t*1.5+i)*0.05;
    x.save();x.translate(px,py);x.rotate(sw);poly([[-15,0],[15,0],[0,34]],cols[i%4]);poly([[-15,0],[0,0],[0,34]],'rgba(0,0,0,0.12)');x.restore();}
}
function poster(){
  // big poster: "SONHO" (dream) with footballer silhouette
  x.save();x.translate(474,410);x.rotate(0.02);
  rr(4,6,180,232,3);x.fillStyle='rgba(0,0,0,0.35)';x.fill();
  rr(0,0,180,232,3);x.fillStyle=lg(0,0,0,232,[[0,'#ff9a3c'],[0.55,'#e8465a'],[1,'#4b1f6e']]);x.fill();
  ell(90,120,48,48,'rgba(255,230,150,0.75)');
  // stadium silhouette
  poly([[0,190],[30,170],[150,170],[180,190],[180,232],[0,232]],'#2a1240');
  for(let i=0;i<6;i++){x.fillStyle='#2a1240';x.fillRect(12+i*32,140,3,40);ell(13.5+i*32,140,6,4,'rgba(255,255,220,0.9)')}
  // player silhouette kicking
  x.fillStyle='#1d0c2e';x.strokeStyle='#1d0c2e';x.lineCap='round';
  ell(84,92,9,9,'#1d0c2e');
  line([[86,102],[92,140]],'#1d0c2e',11);
  line([[90,108],[70,118],[60,108]],'#1d0c2e',6);line([[90,108],[112,104],[124,92]],'#1d0c2e',6);
  line([[92,140],[78,160],[74,180]],'#1d0c2e',8);line([[92,140],[114,150],[132,138]],'#1d0c2e',8);
  ell(146,132,8,8,'#fff');x.beginPath();x.arc(146,132,8,0,6.28);x.strokeStyle='#1d0c2e';x.lineWidth=1.5;x.stroke();
  x.fillStyle='#fff';x.font=`900 30px ${F}`;x.textAlign='center';x.fillText('SONHO',90,40);
  x.font=`700 11px ${F}`;x.fillStyle='rgba(255,255,255,0.85)';x.fillText('NUNCA DESISTAS',90,58);
  // tape
  x.fillStyle='rgba(240,235,210,0.7)';x.save();x.translate(4,4);x.rotate(-0.7);x.fillRect(-12,-5,24,10);x.restore();
  x.save();x.translate(176,4);x.rotate(0.7);x.fillRect(-12,-5,24,10);x.restore();
  x.lineCap='butt';x.restore();
}
function pennantPT(t){
  x.save();x.translate(398,548);x.rotate(-0.08+Math.sin(t*1.3)*0.02);
  x.fillStyle='#5a3a22';x.fillRect(-4,-2,8,62);
  poly([[4,0],[78,22],[4,48]],'#c8102e');
  poly([[4,0],[30,8],[30,40],[4,48]],'#006600');
  ell(30,24,9,9,'#ffcc00');ell(30,24,5,5,'#c8102e');
  x.restore();
}
function shelf(t){
  // board & brackets
  x.fillStyle='rgba(0,0,0,0.3)';x.fillRect(368,702,280,8);
  rr(360,690,286,12,2);x.fillStyle=lg(0,690,0,702,[[0,'#b07a4a'],[1,'#6e4527']]);x.fill();
  [390,610].forEach(bx=>{poly([[bx,702],[bx+8,702],[bx+8,730],[bx,722]],'#3b3b4a')});
  // books
  const books=[['#2e86de',14,46],['#e1b12c',12,40],['#c0392b',16,50],['#27ae60',11,38],['#8e44ad',13,44]];
  let bx=372;books.forEach(([col,w,h],i)=>{rr(bx,690-h,w,h,1);x.fillStyle=col;x.fill();x.fillStyle='rgba(255,255,255,0.35)';x.fillRect(bx+2,690-h+6,w-4,2);x.fillRect(bx+2,690-h+h-10,w-4,2);x.fillStyle='rgba(0,0,0,0.2)';x.fillRect(bx+w-3,690-h,3,h);bx+=w+1});
  // leaning book
  x.save();x.translate(bx+2,690);x.rotate(0.35);rr(0,-42,12,42,1);x.fillStyle='#16a085';x.fill();x.restore();
  // trophies
  function trophy(tx,s){x.save();x.translate(tx,690);x.scale(s,s);
    rr(-14,-12,28,12,2);x.fillStyle='#4a2d1a';x.fill();x.fillStyle='#d4af37';x.fillRect(-7,-9,14,5);
    x.fillStyle=lg(-10,0,10,0,[[0,'#a87d16'],[0.4,'#ffe27a'],[1,'#b8861b']]);
    x.fillRect(-3,-26,6,14);
    x.beginPath();x.moveTo(-14,-56);x.lineTo(14,-56);x.quadraticCurveTo(14,-28,0,-26);x.quadraticCurveTo(-14,-28,-14,-56);x.fill();
    x.beginPath();x.arc(-15,-46,6,Math.PI*0.5,Math.PI*1.5);x.strokeStyle='#d4a52a';x.lineWidth=3;x.stroke();
    x.beginPath();x.arc(15,-46,6,-Math.PI*0.5,Math.PI*0.5);x.stroke();
    x.fillStyle='rgba(255,255,255,0.6)';x.fillRect(-9,-53,3,16);
    x.restore();}
  trophy(498,0.9);trophy(530,0.7);
  // mini football
  miniBall(566,676,14,0);
  // framed family photo
  x.save();x.translate(612,690);x.rotate(-0.06);
  rr(-22,-54,44,54,3);x.fillStyle='#8a5a32';x.fill();rr(-17,-49,34,40,1);x.fillStyle=lg(0,-49,0,-9,[[0,'#8fd3ff'],[1,'#f7d794']]);x.fill();
  ell(-7,-24,5,5,'#c68b5e');ell(7,-26,6,6,'#d9a07a');ell(-1,-20,4,4,'#e0b090');
  x.fillStyle='#2a6b3f';x.fillRect(-12,-19,10,10);x.fillStyle='#b2384a';x.fillRect(1,-20,12,11);x.fillStyle='#f0c040';x.fillRect(-5,-16,8,7);
  poly([[-4,0],[4,0],[12,6],[-12,6]],'#5d3b20');x.restore();
}
function miniBall(cx,cy,r,rot){
  x.save();x.translate(cx,cy);x.rotate(rot);
  ell(0,0,r,r,rg(-r*0.4,-r*0.4,r*0.1,0,0,r,[[0,'#ffffff'],[0.7,'#e6e6ea'],[1,'#a9a9b5']]));
  x.fillStyle='#222';
  const pent=(px,py,s,a)=>{x.beginPath();for(let i=0;i<5;i++){const an=a+i*2*Math.PI/5;x.lineTo(px+Math.cos(an)*s,py+Math.sin(an)*s)}x.closePath();x.fill()};
  x.save();x.beginPath();x.arc(0,0,r,0,6.28);x.clip();
  pent(0,0,r*0.33,-Math.PI/2);
  for(let i=0;i<5;i++){const an=-Math.PI/2+i*2*Math.PI/5;pent(Math.cos(an)*r*0.95,Math.sin(an)*r*0.95,r*0.3,an+Math.PI/2);
    line([[Math.cos(an)*r*0.3,Math.sin(an)*r*0.3],[Math.cos(an)*r*0.7,Math.sin(an)*r*0.7]],'#555',Math.max(0.8,r*0.05));}
  x.restore();
  x.beginPath();x.arc(0,0,r,0,6.28);x.strokeStyle='rgba(0,0,0,0.35)';x.lineWidth=1;x.stroke();
  x.restore();
}

  x.fillStyle='#fff6c8';x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr2=i%2?4:9;x.lineTo(6+Math.cos(a)*rr2,-20+Math.sin(a)*rr2)}x.closePath();x.fill();
  x.restore();
}
function cloudPath(cx,cy,rx,ry){
  x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
  const n=16;for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const pr=(i%2?34:42);x.moveTo(cx+Math.cos(a)*rx*0.93+pr,cy+Math.sin(a)*ry*0.9);x.arc(cx+Math.cos(a)*rx*0.93,cy+Math.sin(a)*ry*0.9,pr,0,Math.PI*2)}
}
function bubble(t){
  const dots=[[300,770,6,0.10],[316,724,9,0.17],[338,668,12,0.24],[364,604,15,0.29]];
  dots.forEach(([dx,dy,dr,ts])=>{const s=easeOutBack(clamp((t-ts)/0.18));if(s<=0)return;
    const fl=Math.sin(t*2+dx)*2;
    x.save();x.shadowColor='rgba(200,210,255,0.8)';x.shadowBlur=14;ell(dx,dy+fl,dr*s,dr*s,'#ffffff');x.restore();});
  const p=clamp((t-0.30)/0.32);if(p<=0)return;
  const s=easeOutBack(p);const float=Math.sin(t*1.8)*4;
  const cx=452,cy=340+float;
  x.save();x.translate(380,520);x.scale(s,s);x.translate(-380,-520);
  x.globalAlpha=clamp(p*2);
  x.save();x.shadowColor='rgba(170,190,255,0.9)';x.shadowBlur=40;cloudPath(cx,cy,200,130);x.fillStyle='#ffffff';x.fill('nonzero');x.restore();
  cloudPath(cx,cy,200,130);x.fillStyle=lg(0,cy-170,0,cy+170,[[0,'#ffffff'],[0.75,'#f3f4ff'],[1,'#dfe3ff']]);x.fill('nonzero');
  // sparkles inside
  for(let i=0;i<6;i++){const sx=cx-170+i*68,sy=cy-110+((i*37)%60),a=0.4+0.4*Math.sin(t*4+i);
    x.fillStyle=`rgba(255,200,60,${a})`;x.beginPath();for(let k=0;k<8;k++){const an=k*Math.PI/4,r2=k%2?2:6;x.lineTo(sx+Math.cos(an)*r2,sy+Math.sin(an)*r2)}x.closePath();x.fill();}
  trophyBig(cx-62,cy-62,1.05);
  miniBall(cx+62,cy-66,42,Math.sin(t*2)*0.15+t*0.6);
  x.fillStyle='#2b2a6e';x.font=`800 29px ${F}`;x.textAlign='center';
  ['Я должен стать','профессиональным','футболистом!'].forEach((s2,i)=>x.fillText(s2,cx,cy+38+i*35));
  x.restore();
}
function flameIcon(cx,cy,s){
  x.save();x.translate(cx,cy);x.scale(s,s);
  x.beginPath();x.moveTo(0,14);x.bezierCurveTo(-13,14,-14,0,-8,-6);x.bezierCurveTo(-6,0,-3,0,-3,0);x.bezierCurveTo(-6,-10,0,-14,2,-18);x.bezierCurveTo(4,-8,14,-4,12,6);x.bezierCurveTo(11,12,6,14,0,14);x.closePath();
  x.fillStyle=lg(0,-18,0,14,[[0,'#ff9f1c'],[1,'#e63946']]);x.fill();
  x.beginPath();x.moveTo(0,14);x.bezierCurveTo(-6,14,-7,6,-3,2);x.bezierCurveTo(-1,6,2,4,2,0);x.bezierCurveTo(6,4,7,12,0,14);x.fillStyle='#ffd166';x.fill();
  x.restore();
}
function title(){

  x.fillText('Как Роналду стал легендой?',360,70);x.restore();

}
function caption(t){
  const a=easeOut(clamp((t-0.25)/0.3));if(a<=0)return;
  x.save();x.globalAlpha=a;x.translate(0,(1-a)*24);
  x.save();x.shadowColor='rgba(0,0,0,0.5)';x.shadowBlur=20;rr(28,1085,664,150,24);x.fillStyle='rgba(14,14,40,0.9)';x.fill();x.restore();
  rr(28,1085,664,150,24);x.strokeStyle='rgba(255,255,255,0.08)';x.lineWidth=2;x.stroke();
  x.fillStyle='#fff';x.font=`800 38px ${F}`;x.textAlign='center';
  x.fillText('С детства он мечтал стать',360,1150);x.fillText('великим футболистом',360,1198);

}
function vignette(){
  x.fillStyle=rg(360,700,250,360,700,900,[[0,'rgba(0,0,20,0)'],[1,'rgba(0,0,20,0.55)']]);x.fillRect(0,0,W,H);
  // cool night grade
  x.save();x.globalCompositeOperation='multiply';x.fillStyle='rgba(190,195,255,1)';x.globalAlpha=0.25;x.fillRect(0,0,W,H);x.restore();
}

function draw(i){
  const t=i/FPS;
  x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;x.globalCompositeOperation='source-over';
  wall();bunting(t);poster();pennantPT(t);shelf(t);
  windowScene(t);curtains(t);
  floor();floorProps(t);
  nightstand(t);
  bedBack(t);boyHead(t);duvet(t);bedFront();
  moonBeam(t);lampGlow(t);
  vignette();
  zzz(t);
  bubble(t);
  title();caption(t);
  // progress bar
  x.fillStyle='#ffcf3f';x.fillRect(0,1270,116+i*1.1,10);
}
window.draw=draw;
document.fonts.load(`800 30px ${F}`).then(()=>{draw(60);window.ready=true});
</script></body></html>
